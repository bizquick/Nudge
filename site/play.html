<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Addly player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  // The Addly app shows YouTube videos through this page: YouTube's player needs to sit
  // inside a real website. The video id comes after the # (it never reaches our server).
  var params = new URLSearchParams(location.hash.slice(1));
  var id = params.get('yt') || '';
  var start = parseInt(params.get('t') || '0', 10) || 0;
  if (/^[\w-]{6,}$/.test(id)) {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?playsinline=1&rel=0&modestbranding=1' + (start ? '&start=' + start : '');
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
